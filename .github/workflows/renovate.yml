name: Renovate

on:
  schedule:
    # 每天 18:00 UTC（北京时间次日 02:00）检查依赖更新
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成计划，不创建分支和 PR"
        type: boolean
        default: false
      log_level:
        description: "日志级别"
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_REQUIRE_CONFIG: "required"
      RENOVATE_ONBOARDING: "false"
      # 使用 runner 上安装的 Flutter/Dart，而不是 Renovate 的 Docker 工具链
      RENOVATE_BINARY_SOURCE: global
      RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@whitesourcesoftware.com>"
      LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.log_level || 'info' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Flutter version from FVM config
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action/config@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Renovate token
        shell: bash
        run: |
          if [ -z "${RENOVATE_TOKEN}" ]; then
            echo "::error::缺少 RENOVATE_TOKEN。请按 docs/dependency-updates.md 创建 PAT 并添加到仓库 Secrets。"
            exit 1
          fi

      - name: Validate Renovate config
        run: npx --yes --package renovate@44 renovate-config-validator renovate.json5

      - name: Run Renovate (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npx --yes renovate@44
        env:
          RENOVATE_DRY_RUN: full

      - name: Run Renovate
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npx --yes renovate@44
